<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecuerdaJM - Suscripción</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A4DFF">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="RecuerdaJM">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0A4DFF;
  font-family:'Poppins',sans-serif;
  color:white;
  min-height:100vh;
}
.pantalla{
  min-height:100vh;
  padding:28px 24px 34px;
  display:flex;
  flex-direction:column;
  text-align:center;
}
.back-arrow{
  font-size:34px;
  text-decoration:none;
  color:white;
  align-self:flex-start;
  margin-bottom:20px;
}
h1{
  font-size:34px;
  margin-bottom:10px;
}
.sub{
  font-size:16px;
  opacity:.9;
  margin-bottom:40px;
}
.plan{
  background:white;
  color:#333333;
  border-radius:24px;
  padding:30px 24px;
  margin-bottom:20px;
}
.plan-precio{
  font-size:44px;
  font-weight:800;
  color:#0A4DFF;
}
.plan-detalle{
  font-size:15px;
  color:#666666;
  margin-top:6px;
  margin-bottom:20px;
}
.plan ul{
  text-align:left;
  list-style:none;
  font-size:15px;
  color:#333333;
}
.plan li{
  margin-bottom:8px;
  padding-left:22px;
  position:relative;
}
.plan li:before{
  content:"✓";
  color:#16A34A;
  font-weight:700;
  position:absolute;
  left:0;
}
.boton{
  margin-top:auto;
  width:100%;
  height:80px;
  border:none;
  border-radius:40px;
  background:white;
  color:#0A4DFF;
  font-size:24px;
  font-weight:700;
  cursor:pointer;
}
.aviso{
  font-size:13px;
  opacity:.75;
  margin-top:16px;
}
</style>
</head>
<body>
<div class="pantalla">
  <a href="app.html" class="back-arrow">&#8592;</a>
  <h1>Suscripción RecuerdaJM</h1>
  <div class="sub">Recordatorios sin límite, para siempre.</div>

  <div class="plan">
    <div class="plan-precio">S/ 4.90</div>
    <div class="plan-detalle">por mes</div>
    <ul>
      <li>Recordatorios ilimitados</li>
      <li>Repetición automática (semanal, mensual, anual)</li>
      <li>Tus recordatorios nunca se eliminan, aunque canceles</li>
    </ul>
  </div>

  <button class="boton" id="btnSuscribir">Suscribirme</button>
  <div class="aviso">Pago seguro procesado por Culqi.</div>
</div>

<script src="https://checkout.culqi.com/js/v4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = 'https://wekwkbrtxvwfbselprgn.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sCA-x3urJUAUqNgdpt7WVw_y-Womhap';
  var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // IMPORTANTE: reemplaza esto por tu llave PÚBLICA real de Culqi
  // cuando tu cuenta esté activa (empieza con "pk_test_" o "pk_live_").
  // La llave pública SÍ es segura de mostrar aquí; la llave SECRETA nunca.
  Culqi.publicKey = 'pk_test_PENDIENTE_DE_REEMPLAZAR';

  Culqi.settings({
    title: 'RecuerdaJM',
    currency: 'PEN',
    amount: 490 // S/ 4.90 en céntimos
  });

  Culqi.options({
    lang: 'auto',
    installments: false,
    paymentMethods: { tarjeta: true, yape: false }
  });

  document.getElementById('btnSuscribir').addEventListener('click', async function () {
    var sesion = await supabaseClient.auth.getSession();
    if (!sesion.data || !sesion.data.session) {
      window.location.href = 'login.html';
      return;
    }
    Culqi.open();
  });

  // Culqi llama a esta función cuando el usuario completa el pago
  window.culqi = async function () {
    if (Culqi.token) {
      // AQUÍ falta el último paso: enviar Culqi.token.id a una función
      // de servidor (Supabase Edge Function) que, usando la llave SECRETA
      // de Culqi, confirme el cobro real y marque al usuario como
      // suscrito en la tabla "Suscripciones". Esa función se arma
      // en cuanto tu cuenta de Culqi esté activa.
      alert('Pago recibido. Falta conectar la confirmación final del servidor (siguiente paso pendiente).');
    } else if (Culqi.error) {
      alert('Hubo un problema con el pago: ' + Culqi.error.user_message);
    }
  };
</script>

</body>
</html>
