<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Inteligente</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A4DFF">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="AgendaInteligenteJM">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#0A4DFF;
  font-family:'Poppins',sans-serif;
}
.pantalla{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:70px 24px 34px;
}
.espacio-superior{
  height:150px;
}
.contenido{
  width:100%;
  text-align:center;
  color:white;
}
h1{
  font-size:64px;
  font-weight:700;
  line-height:1.02;
  margin-bottom:55px;
}
.texto{
  font-size:22px;
  line-height:1.25;
  font-weight:400;
}
.boton{
  width:100%;
  max-width:430px;
  height:88px;
  background:white;
  color:#0A4DFF;
  border:none;
  border-radius:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  font-size:30px;
  font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
.mas{
  font-size:62px;
  font-weight:300;
}
/* Enlace simple para ver la agenda, debajo del botón principal */
.ver-recordatorios{
  margin-top:22px;
  color:white;
  font-size:18px;
  font-weight:600;
  text-decoration:underline;
  background:none;
  border:none;
  cursor:pointer;
  font-family:'Poppins',sans-serif;
}
</style>
</head>
<body>
<div class="pantalla">
  <div class="espacio-superior"></div>
  <div class="contenido">
    <h1>¿Qué no<br>quieres<br>olvidar?</h1>
    <div class="texto">
      <div>Escríbelo ahora.</div>
      <div>Nosotros te lo recordaremos</div>
      <div>Cuando tú elijas.</div>
    </div>
  </div>
  <div>
    <button class="boton" onclick="location.href='recordar.html'">
      <span class="mas">+</span>
      <span>Recordar</span>
    </button>
    <button class="ver-recordatorios" onclick="location.href='app.html'">Ver mis recordatorios</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = 'https://wekwkbrtxvwfbselprgn.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sCA-x3urJUAUqNgdpt7WVw_y-Womhap';
  var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Si ya inició sesión antes, lo llevamos directo a su agenda
  async function revisarSesion() {
    var resultado = await supabaseClient.auth.getSession();
    if (resultado.data && resultado.data.session) {
      window.location.href = 'app.html';
    }
  }
  revisarSesion();
</script>
</body>
</html>
