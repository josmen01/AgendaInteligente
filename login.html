<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Inteligente - Iniciar sesión</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A4DFF">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="AgendaInteligenteJM">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#0A4DFF;
  font-family:'Poppins',sans-serif;
  color:white;
}
.pantalla{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:24px;
  text-align:center;
}
h1{
  font-size:40px;
  font-weight:700;
  margin-bottom:16px;
  line-height:1.1;
}
.texto{
  font-size:18px;
  opacity:.9;
  margin-bottom:50px;
}
.boton-google{
  width:100%;
  max-width:400px;
  height:64px;
  background:white;
  color:#333333;
  border:none;
  border-radius:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.error-carga{
  display:none;
  background:#FFFFFF;
  color:#E53935;
  font-size:14px;
  font-weight:600;
  padding:14px;
  border-radius:14px;
  margin-top:20px;
  max-width:400px;
}
</style>
</head>
<body>
<div class="pantalla">
  <h1>Agenda Inteligente</h1>
  <div class="texto">Inicia sesión para ver y guardar tus recordatorios.</div>

  <button class="boton-google" id="btnGoogle">
    <svg width="22" height="22" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16.1 3 9.3 7.5 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.5 26.7 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.2 40.4 16 45 24 45z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.7 44 24c0-1.4-.1-2.4-.4-3.5z"/>
    </svg>
    Continuar con Google
  </button>

  <div class="error-carga" id="errorLogin"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = 'https://wekwkbrtxvwfbselprgn.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sCA-x3urJUAUqNgdpt7WVw_y-Womhap';
  var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Si ya hay una sesión abierta, no mostramos el login: vamos directo a la agenda
  async function revisarSesion() {
    var resultado = await supabaseClient.auth.getSession();
    if (resultado.data && resultado.data.session) {
      window.location.href = 'app.html';
    }
  }
  revisarSesion();

  document.getElementById('btnGoogle').addEventListener('click', async function () {
    var resultado = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/app.html'
      }
    });

    if (resultado.error) {
      var errorDiv = document.getElementById('errorLogin');
      errorDiv.textContent = 'No se pudo iniciar sesión: ' + resultado.error.message;
      errorDiv.style.display = 'block';
    }
  });
</script>

</body>
</html>
