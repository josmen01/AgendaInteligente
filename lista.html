<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Inteligente - Lista</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#0A4DFF;
  font-family:'Poppins',sans-serif;
  color:white;
  min-height:100vh;
}
.pantalla{
  min-height:100vh;
  padding:28px 24px 34px;
  display:flex;
  flex-direction:column;
}
.arriba{
  margin-bottom:30px;
}
.back-arrow{
  font-size:34px;
  text-decoration:none;
  color:white;
}
h1{
  font-size:36px;
  font-weight:700;
  margin-bottom:8px;
}
.sub{
  font-size:16px;
  opacity:.9;
  margin-bottom:28px;
}
.tarjeta{
  width:100%;
  background:white;
  color:#333333;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}
.tarjeta-texto{
  font-size:20px;
  font-weight:600;
  margin-bottom:6px;
}
.tarjeta-fecha{
  font-size:15px;
  color:#666666;
}
.vacio{
  text-align:center;
  font-size:18px;
  opacity:.9;
  margin-top:60px;
}
.boton{
  margin-top:auto;
  width:100%;
  height:88px;
  border:none;
  border-radius:44px;
  background:white;
  color:#0A4DFF;
  font-size:26px;
  font-weight:700;
}
</style>
</head>
<body>
<div class="pantalla">
  <div class="arriba">
    <a href="app.html" class="back-arrow">&#8592;</a>
  </div>
  <h1 id="titulo">Recordatorios</h1>
  <div class="sub" id="subtitulo"></div>

  <div id="contenedorLista"></div>

  <button class="boton" onclick="location.href='recordar.html'">+ Recordar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = 'https://wekwkbrtxvwfbselprgn.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sCA-x3urJUAUqNgdpt7WVw_y-Womhap';
  var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function fechaAString(fecha) {
    var y = fecha.getFullYear();
    var m = String(fecha.getMonth() + 1).padStart(2, '0');
    var d = String(fecha.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function fechaBonita(fechaStr) {
    var partes = fechaStr.split('-');
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var dia = parseInt(partes[2], 10);
    var mes = meses[parseInt(partes[1], 10) - 1];
    return dia + ' de ' + mes + ' de ' + partes[0];
  }

  var parametros = new URLSearchParams(window.location.search);
  var tipo = parametros.get('tipo') || 'hoy';

  var titulos = {
    hoy: 'Hoy',
    manana: 'Mañana',
    proximos: 'Próximos días'
  };
  document.getElementById('titulo').textContent = titulos[tipo] || 'Recordatorios';
  document.getElementById('subtitulo').textContent = 'Todo organizado por prioridad.';

  async function cargarLista() {
    var resultado = await supabaseClient
      .from('Recordatorios')
      .select('*')
      .order('fecha', { ascending: true });

    var contenedor = document.getElementById('contenedorLista');

    if (resultado.error || !resultado.data) {
      contenedor.innerHTML = '<div class="vacio">No se pudo cargar la lista.</div>';
      return;
    }

    var hoy = new Date();
    var manana = new Date();
    manana.setDate(hoy.getDate() + 1);

    var hoyStr = fechaAString(hoy);
    var mananaStr = fechaAString(manana);

    var filtrados = resultado.data.filter(function (item) {
      var f = item['fecha'];
      if (!f) return false;
      if (tipo === 'hoy') return f === hoyStr;
      if (tipo === 'manana') return f === mananaStr;
      if (tipo === 'proximos') return f > mananaStr;
      return false;
    });

    if (filtrados.length === 0) {
      contenedor.innerHTML = '<div class="vacio">No tienes recordatorios aquí todavía.</div>';
      return;
    }

    contenedor.innerHTML = filtrados.map(function (item) {
      return '<div class="tarjeta">' +
        '<div class="tarjeta-texto">' + item['titulo'] + '</div>' +
        '<div class="tarjeta-fecha">' + fechaBonita(item['fecha']) + '</div>' +
        '</div>';
    }).join('');
  }

  cargarLista();
</script>

</body>
</html>
